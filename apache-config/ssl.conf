<VirtualHost *:443>
    ServerName emiliehedou.fr
    ServerAlias www.emiliehedou.fr

    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/emiliehedou.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/emiliehedou.fr/privkey.pem

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName emiliehedou.fr
    ServerAlias www.emiliehedou.fr

    DocumentRoot /var/www/html

    # Rediriger tout le HTTP vers HTTPS
    Redirect permanent / https://emiliehedou.fr/
</VirtualHost>
