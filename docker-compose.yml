version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - C:\xampp\htdocs\EmilieHedou-php:/var/www/html
      - /etc/letsencrypt:/etc/letsencrypt:ro   # Monter les certificats letsencrypt en lecture seule
      - ./apache-config:/etc/apache2/sites-available
    depends_on:
      - db
    env_file:
      - .env.docker
    networks:
      - emiliehedou-network

  db:
    image: mysql:8.0
    container_name: emiliehedou-db
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - /home/debian/www/emiliehedou/db_data/sauvegarde.sql:/docker-entrypoint-initdb.d/sauvegarde.sql
    networks:
      - emiliehedou-network

volumes:
  db_data:

networks:
  emiliehedou-network:
    driver: bridge
